# merge-audit (acardote/personal-assistant-ultra#581; design: docs/design/merge-model.md section 4).
#
# Detection, not prevention. Flags every first-parent default-branch commit not
# created by GitHub as a PR merge (R2: direct and laundered pushes), every bot
# merge without a successful default-branch merge.yml run that logged its
# inline verdict recomputation for the merged head (R1), control changes (R3),
# forged review-verdict checks (R4), workflow runs whose definition is not the
# default branch's and workflow files on branches (R5), and review records
# edited or deleted (R7). Findings go to the "fleet-audit: merge audit findings"
# issue (comments) and the job summary; every FLAG is also written into the
# hash chain in that issue's body, which the front door reads, verifies and
# turns into inbox items, so deleting a comment does not erase a FLAG.
#
# The admin login is shared by the operator and the agents (A11): it can delete
# comments, artifacts, runs and issues here. That cannot be prevented, so it is
# made detectable and fails closed: state is a hash chain bound to the run that
# produced it and to the audit code it ran; a deleted predecessor artifact, a
# run_number gap (deleted runs), an anchor ahead of the state (rollback) or
# state from other audit code stops the audit (exit 2) until the operator
# dispatches this workflow with `rebaseline`, which is itself a FLAG and a
# chain discontinuity the front door alerts on.
#
# Hard rules (tests in .github/audit/test_audit.py check each one):
# - Runs the default branch's definition only: triggers are push to main,
#   schedule and workflow_dispatch, and the guard step refuses any other
#   workflow ref. Never pull_request, pull_request_target or workflow_run.
# - Runs only default-branch code: the checkout is github.workflow_sha.
# - Token: read-only except issues: write (findings comments and the chain in
#   the findings issue body). No contents, pull-requests, actions or checks write.
# - Dispatch inputs reach the script only through env, never through ${{ }} in
#   a run line.
# - The front door checks from outside the repo that this workflow ran
#   successfully in the last 60 minutes, that every run since its last
#   heartbeat ran the pinned blobs, that no audit run was deleted, and that the
#   chain continues (design R6).
#
# Never delete runs or artifacts of this workflow: the audit reads that as
# tampering and stops. Re-running is harmless: a re-run of a run that already
# succeeded writes nothing; a re-run of a failed run audits normally.
#
# Each successful run also emits one `fleet-audit-chain` notice annotation
# (seq, digest, run id, FLAG count). Annotations are bound to the run and the
# front door reads them anonymously as the witness the anchor must match.
#
# Changing this file is a 7a change: the operator merges.
name: merge-audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      rebaseline:
        description: "Only after investigating a fail-closed run: continue (keep the newest readable state) or fresh (no state)"
        type: choice
        options: ["no", "continue", "fresh"]
        default: "no"
      reason:
        description: "Why (recorded in the chain and in the FLAG)"
        type: string
        default: ""

permissions: {}

concurrency:
  group: merge-audit
  cancel-in-progress: false

jobs:
  audit:
    name: merge-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
      issues: write
    steps:
      - name: Provenance
        run: echo "workflow_ref=${GITHUB_WORKFLOW_REF} workflow_sha=${GITHUB_WORKFLOW_SHA} run_id=${GITHUB_RUN_ID} run_number=${GITHUB_RUN_NUMBER} event=${GITHUB_EVENT_NAME}"

      - name: Refuse a definition not on the default branch
        run: |
          expected="${GITHUB_REPOSITORY}/.github/workflows/audit.yml@refs/heads/main"
          case "${GITHUB_EVENT_NAME}" in
            push|schedule|workflow_dispatch) ;;
            *) echo "merge-audit: FAIL: event=${GITHUB_EVENT_NAME}"; exit 1 ;;
          esac
          if [ "${GITHUB_WORKFLOW_REF}" != "${expected}" ]; then
            echo "merge-audit: FAIL: workflow_ref=${GITHUB_WORKFLOW_REF}, expected ${expected}"
            exit 1
          fi

      - name: Check out the default-branch commit that defined this run
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/audit

      - name: Confirm the checkout is the workflow commit
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "${actual}" != "${GITHUB_WORKFLOW_SHA}" ]; then
            echo "merge-audit: FAIL: checked out ${actual}, expected workflow_sha ${GITHUB_WORKFLOW_SHA}"
            exit 1
          fi

      - name: Audit
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          VARS_JSON: ${{ toJSON(vars) }}
          AUDIT_HMAC_KEY: ${{ secrets.FLEET_AUDIT_HMAC_KEY }}
          REBASELINE: ${{ inputs.rebaseline }}
          REBASELINE_REASON: ${{ inputs.reason }}
          STATE_DIR: ${{ runner.temp }}/fleet-audit
        run: python3 .github/audit/audit.py --repo "${GITHUB_REPOSITORY}" --config .github/audit/config.json --state-out "${STATE_DIR}/state.json"

      - name: Save state for the next run
        # A re-run attempt of a run that already succeeded writes nothing
        # (audit.py exits 0 with noop=true): the chain entry, witness and state
        # belong to the attempt that succeeded. Any other attempt uploads.
        if: steps.audit.outputs.noop != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fleet-audit-state
          path: ${{ runner.temp }}/fleet-audit/state.json
          retention-days: 90
          if-no-files-found: error
