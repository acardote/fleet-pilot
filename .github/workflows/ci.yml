# Basic CI for the fleet-autonomy auto-merge pilot (acardote/personal-assistant-ultra#530).
# review-verdict (#579) requires this workflow to be green at the PR head SHA.
# Runs the repo's Python tests if there are any; otherwise succeeds.
name: ci

# review-verdict counts CI evidence only from PUSH runs on the PR's head branch
# whose ci.yml equals the default branch's (a pull_request run cannot be tied to
# the default branch's definition through the API); see fleet-pilot#1 / #579.
on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: tests
        run: |
          python -m pip install --quiet "pytest>=8.0"
          if git ls-files '*test_*.py' '*_test.py' | grep -q .; then
            python -m pytest -q -p no:cacheprovider
          else
            echo "no tests in this repo yet"
          fi
